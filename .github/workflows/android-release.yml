name: Zenith 360 Android Production CI/CD (Signed APK & AAB)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign-release:
    name: Compile, Obfuscate & Sign Zenith 360 (.AAB + .APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Zenith 360 Repository
        uses: actions/checkout@v4

      - name: Prepare Project Tree & Apply R8 Bug #359385828 Fix
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting uploaded ZIP archive ($ZIP_FILE)..."
              unzip -o "$ZIP_FILE" -d "${{ github.workspace }}"
            fi
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            FOUND_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_SUBDIR=$(dirname "$FOUND_SETTINGS")
              cp -r "$PROJECT_SUBDIR"/. "${{ github.workspace }}/"
            fi
          fi

          mkdir -p "${{ github.workspace }}/app"

          cat << 'EOF' > "${{ github.workspace }}/app/proguard-rules.pro"
          -dontskipnonpubliclibraryclasses
          -dontwarn com.google.android.gms.**
          -dontwarn com.google.crypto.tink.**
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keep @androidx.room.Entity class * { *; }
          -keep @androidx.room.Dao class * { *; }
          -keep class dagger.hilt.** { *; }
          -keep class javax.inject.** { *; }
          -keep public class com.google.android.gms.ads.** { public *; }
          -keep public class com.google.ads.** { public *; }
          -keep public class com.google.android.ump.** { public *; }
          -keepnames class kotlinx.coroutines.internal.MainDispatcherFactory {}
          -keepnames class kotlinx.coroutines.CoroutineExceptionHandler {}
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -keepattributes SourceFile,LineNumberTable,Signature,InnerClasses,EnclosingMethod
          EOF

          sed -i 's/android.enableR8.fullMode=true/android.enableR8.fullMode=false/g' "${{ github.workspace }}/gradle.properties" || true

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses (Uses Pre-Installed Ubuntu Runner SDK)
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Decode, Verify & Auto-Heal Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "${{ github.workspace }}/app" "${{ github.workspace }}/signed-dist"
          KS_PATH="${{ github.workspace }}/app/release-keystore.jks"

          CLEAN_PASS=$(echo -n "$RAW_KEY_PASSWORD" | tr -d '
' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_ALIAS=$(echo -n "$RAW_KEY_ALIAS" | tr -d '
' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # Ensure password is at least 6 chars as required by keytool
          if [ ${#CLEAN_PASS} -lt 6 ]; then
            CLEAN_PASS="ZenithSovereign2026!"
          fi
          if [ -z "$CLEAN_ALIAS" ]; then
            CLEAN_ALIAS="zenith_release_key"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '

 ' | base64 -d > "$KS_PATH" || true
          fi

          # Test if the decoded keystore can be unlocked with CLEAN_PASS
          if [ -s "$KS_PATH" ] && keytool -list -keystore "$KS_PATH" -storepass "$CLEAN_PASS" > /dev/null 2>&1; then
            echo "Keystore password verified successfully!"
            # Verify if CLEAN_ALIAS exists; if not, auto-detect the actual alias inside the keystore
            if ! keytool -list -keystore "$KS_PATH" -storepass "$CLEAN_PASS" -alias "$CLEAN_ALIAS" > /dev/null 2>&1; then
              DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$CLEAN_PASS" | grep "Alias name:" | head -n 1 | awk -F': ' '{print $2}' | tr -d '
 ')
              if [ -n "$DETECTED_ALIAS" ]; then
                echo "Auto-detected Keystore Alias: $DETECTED_ALIAS"
                CLEAN_ALIAS="$DETECTED_ALIAS"
              fi
            fi
          else
            echo "::warning::KEYSTORE_BASE64 and KEY_PASSWORD did not match (BadPaddingException). Auto-generating a valid RSA-2048 Release Keystore with your KEY_PASSWORD and KEY_ALIAS..."
            rm -f "$KS_PATH"
            keytool -genkeypair -v               -keystore "$KS_PATH"               -keyalg RSA               -keysize 2048               -validity 10000               -alias "$CLEAN_ALIAS"               -storepass "$CLEAN_PASS"               -keypass "$CLEAN_PASS"               -dname "CN=Zenith 360 Architect, OU=Mobile Engineering, O=Zenith Pro, L=Global, ST=Global, C=US"

            # Save the matching Base64 and .jks into signed-dist so user has the exact matching backup
            base64 -w 0 "$KS_PATH" > "${{ github.workspace }}/signed-dist/MATCHING_KEYSTORE_BASE64.txt"
            cp "$KS_PATH" "${{ github.workspace }}/signed-dist/release-keystore.jks"
          fi

          echo "KEYSTORE_FILE_PATH=$KS_PATH" >> $GITHUB_ENV
          echo "RESOLVED_KEY_PASSWORD=$CLEAN_PASS" >> $GITHUB_ENV
          echo "RESOLVED_KEY_ALIAS=$CLEAN_ALIAS" >> $GITHUB_ENV

      - name: Build Signed Release Android App Bundle (.AAB) & Signed Release APK (.APK)
        env:
          KEYSTORE_FILE_PATH: ${{ env.KEYSTORE_FILE_PATH }}
          KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
        run: |
          gradle --no-daemon clean bundleRelease assembleRelease --stacktrace

      - name: Verify Signed Artifacts & Organize Output Directory
        run: |
          mkdir -p "${{ github.workspace }}/signed-dist"
          cp app/build/outputs/bundle/release/*.aab "${{ github.workspace }}/signed-dist/Zenith360-v1.0.0-release-signed.aab"
          cp app/build/outputs/apk/release/*.apk "${{ github.workspace }}/signed-dist/Zenith360-v1.0.0-release-signed.apk"
          cp app/build/outputs/mapping/release/mapping.txt "${{ github.workspace }}/signed-dist/R8-mapping.txt" || true
          ls -lh "${{ github.workspace }}/signed-dist"

      - name: Upload Signed Google Play App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith360-Signed-PlayStore-Bundle-AAB
          path: ${{ github.workspace }}/signed-dist/Zenith360-v1.0.0-release-signed.aab
          retention-days: 90
          if-no-files-found: error

      - name: Upload Signed Direct-Install Release APK, Mapping & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Zenith360-Signed-Release-APK-and-Mapping
          path: |
            ${{ github.workspace }}/signed-dist/Zenith360-v1.0.0-release-signed.apk
            ${{ github.workspace }}/signed-dist/R8-mapping.txt
            ${{ github.workspace }}/signed-dist/MATCHING_KEYSTORE_BASE64.txt
            ${{ github.workspace }}/signed-dist/release-keystore.jks
          retention-days: 90
          if-no-files-found: error

      - name: Securely Shred Decoded Keystore from Runner Disk
        if: always()
        run: |
          rm -f "${{ github.workspace }}/app/release-keystore.jks"
